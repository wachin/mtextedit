[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtextedit"
version = "0.1.0"
description = "Modular, async-first Markdown editor component for PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.4",
    "cmarkgfm @ git+https://github.com/wachin/cmarkgfm@e28bfe3f2fdf0db3c61ee8a2b481cb218507ded5",
    "pygments>=2.15",
]

[project.optional-dependencies]
webengine = ["PyQt6-QtWebEngine>=6.4"]
linguistic = ["pyqt6-linguistic-tools"]

[tool.setuptools.packages.find]
include = ["mtextedit*"]

[tool.setuptools.package-data]
mtextedit = ["themes/*.theme", "themes/README.md"]
