[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtextedit"
version = "0.1.0"
description = "Modular, async-first Markdown editor component for PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.4",
    "cmarkgfm @ git+https://github.com/wachin/cmarkgfm@8961e9acf0be2fae5dfc71f8fd7378ce1fc47dd4",
    "pygments>=2.15",
]

[project.optional-dependencies]
webengine = ["PyQt6-QtWebEngine>=6.4"]
linguistic = ["pyqt6-linguistic-tools"]

[tool.setuptools.packages.find]
include = ["mtextedit*"]
